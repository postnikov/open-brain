# PostgreSQL + pgvector for local use. The app runs on the host with the
# authenticated server (`npm run server:hardened`), see README "Quick Start".
# The authenticated server listens on 127.0.0.1 only, so it cannot be published
# from a container port; the legacy unauthenticated server is not shipped here.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: open_brain
      POSTGRES_PASSWORD: open_brain_local
      POSTGRES_DB: open_brain
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: the database is not reachable from other machines.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_brain"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
